# ---------------------------------------------------------------------------
# WORKED EXAMPLE — how to read a Cisco TAC recommended-release page
# ---------------------------------------------------------------------------
worked_example:
  source_id: SRC-001
  url: https://www.cisco.com/c/en/us/support/docs/switches/catalyst-9300-series-switches/214814-recommended-releases-for-catalyst-9200-9.html
  fetch_method: browser only (curl gets 403)
  page_updated: 2026-09-04
  currency_marker: "recommendations stated here are current as of September 2026"
  extracted:
    catalyst_9200: 17.18.4, 17.15.6
    catalyst_9300: 17.18.4, 17.15.6
    catalyst_9400: 17.18.4, 17.15.6
    catalyst_9500: 17.18.4, 17.15.6
    catalyst_9600: 17.18.4, 17.15.6
  revision_history_top:
    - "27.0 | 04-Sep-2026 | Added 17.18.4 in addition to 17.15.6 as recommended releases, removed references to 16.12"
    - "26.0 | 25-Aug-2026 | Updated 17.15.6 as recommended release."
    - "25.0 | 16-Apr-2026 | Updated 17.15.5 as recommended release."
  interpretation: >-
    Cisco now publishes TWO recommended releases per platform. Per every third
    train, Cisco designates an "Extended-Support" release (12mo) vs
    "Standard-Support" (48mo). 17.15 and 17.18 are both Extended-Support.
    DECISION NEEDED: pick one as `gold_version`. Recommend 17.18.4 as
    gold_version (newer extended-support train) and record 17.15.6 in notes
    as the conservative alternative. See `gold_version_policy` below.

  sibling_pages:
    - https://www.cisco.com/c/en/us/support/docs/switches/catalyst-6500-series-switches/214946-recommended-releases-for-catalyst-2960-3.html
      covers: Catalyst 1000/2960/3560/CDB/4500, 3650/3850, 6500/6800
    - https://www.cisco.com/c/en/us/support/docs/wireless/catalyst-9800-series-wireless-controllers/214749-tac-recommended-ios-xe-builds-for-wirele.html
      covers: Catalyst 9800 WLC  <-- needed for WLS-001..004, not yet checked

# ---------------------------------------------------------------------------
# DECISION POLICY for dual recommended releases
# ---------------------------------------------------------------------------
gold_version_policy:
  rule: >-
    Where a TAC page lists two recommended releases, `gold_version` = the
    NEWER Extended-Support train, and the older alternative is preserved in the
    `notes` field so no information is lost.
  pending_confirmation:
    - WLS-001..004 (Catalyst 9800 WLC) gold version — sibling page above is
      identified but has NOT been read yet. Do this before touching WLS rows.
    - MV cameras — no machine-readable source found; manual verification needed.

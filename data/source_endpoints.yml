# ---------------------------------------------------------------------------
# DISCOVERY TECHNIQUES  (use these instead of guessing URLs)
# ---------------------------------------------------------------------------
discovery:
  meraki_search_api: >-
    Public JSON search API on the Meraki docs site. Much faster and more
    reliable than guessing paths. Use from a browser context on any
    documentation.meraki.com page:

      fetch('https://documentation.meraki.com/@api/deki/site/query'
            + '?q=' + encodeURIComponent('firmware changelog')
            + '&limit=40&dream.out.format=json', {credentials: 'omit'})

    Returns {result: [{type, page: {path, title}}, ...]}. Filter to
    type === 'page'. This is how the current Meraki paths below were found
    after the old ones went 404.

  meraki_toc_parsing: >-
    The table of contents on a *Features Directory page lists firmware trains
    in descending order (newest first). Extracting the first few `X.Y.X`
    tokens from the TOC gives you the current trains without parsing the body.
    Verified to work for MX, MR, MS, MG.

  cisco_tac_recommendation: >-
    TAC "Recommended Releases" pages contain a clean HTML table mapping product
    family to recommended release, plus a "Revision History" table with the
    publication date of each revision. The revision history is the best way to
    tell whether the page is current — see SRC-001 below as the worked example.


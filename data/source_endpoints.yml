# Verified Source Endpoint Registry
#
# PURPOSE
#   This file records the exact URLs that were manually verified to work on
#   2026-09-29, so the next refresh does not have to rediscover them by
#   searching. `data/cisco_sources.csv` is the canonical source-of-truth for
#   URLs; this file is the *working notes* layer that explains HOW each URL
#   behaves and what to expect from it.
#
# HOW TO USE
#   1. Run `python3 tools/check_sources.py` to get current HTTP status.
#   2. Anything reported DEAD: look up the replacement in `replacements:` below,
#      or re-discover using the discovery techniques in `discovery:` below.
#   3. Update `verified_on` when you re-confirm a URL by hand.
#
# CRITICAL FETCHING NOTES  (learned the hard way — please read)
#   * cisco.com returns HTTP 403 to plain `curl` / `requests`, even with a
#     browser User-Agent. This is bot-blocking, NOT a dead link. Confirmed:
#     SRC-001 returns 403 via curl but fetches perfectly in a real browser.
#     => Use the integrated browser (Playwright), not curl, for Cisco pages.
#   * documentation.meraki.com DOES serve plain HTTP requests (no bot-block).
#     It is the one source family that is cheap to script.
#   * Meraki content is JavaScript-rendered. Fetching the raw HTML returns an
#     empty <body>. You must render the page before reading innerText.
#   * Several Meraki "Last updated" dates are older than the version data they
#     describe. Treat the page date as a weak signal only.

meta:
  verified_on: 2026-09-29
  verified_by: manual browser fetch
  total_sources: 116
  live_and_fetchable: 104
  dead_404: 5
  last_full_refresh: 2026-09-29   # 97 product rows updated; see tools/refresh_2026_09_29.py

